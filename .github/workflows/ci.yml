name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verdict:
    name: Verdict CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_STANDALONE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verifica
      - name: Declanseaza deploy staging
        if: github.ref == 'refs/heads/main' && success()
        env:
          COOLIFY_DEPLOY_URL: ${{ secrets.COOLIFY_DEPLOY_URL }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_URL" ]; then
            echo "COOLIFY_DEPLOY_URL nu e setat inca - deploy-ul se declanseaza manual din Coolify"
            exit 0
          fi
          curl -sf -X POST "$COOLIFY_DEPLOY_URL"
